<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Ghassen — SAP PP/MM, S/4HANA, Supply Chain" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b1a"/><stop offset=".5" stop-color="#0b1f4a"/><stop offset="1" stop-color="#081430"/></linearGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#1d4ed8" stop-opacity=".55"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.k{font-size:11px;letter-spacing:6px;fill:#38a1ff;font-weight:600}
.n{font-size:46px;font-weight:800;letter-spacing:1px}
.s{font-size:15px;fill:#9fb0cc;letter-spacing:.5px}
.pt{font-size:11px;font-weight:700;fill:#e2ecff}
.av{font-size:11px;font-weight:700;fill:#7fdcff}
.blob{animation:drift 9s ease-in-out infinite alternate}
.b2{animation-duration:12s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translate(-30px,0)}to{transform:translate(30px,14px)}}
.br{fill:none;stroke:#38a1ff;stroke-width:2;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.dot{fill:#7dd3fc;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.ln{fill:none;stroke:#2d8cff;stroke-opacity:.35;stroke-width:1.2;stroke-dasharray:6 8;animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-140}}
.bar{transform-origin:500px 0;animation:grow 4s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleX(.3)}50%{transform:scaleX(1)}}
.pill{animation:rise .8s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.shine{animation:sh 5s ease-in-out infinite}
@keyframes sh{0%,100%{opacity:.75}50%{opacity:1}}
</style>
</defs>
<rect width="1000" height="320" fill="url(#bg)"/>
<circle class="blob" cx="140" cy="90" r="190" fill="url(#g1)"/>
<circle class="blob b2" cx="860" cy="260" r="200" fill="url(#g1)"/>
<path class="ln" d="M0 250 H90 L130 215 H260"/>
<path class="ln" d="M1000 95 H900 L860 60 H740"/>
<path class="ln" d="M60 0 V70"/><path class="ln" d="M940 320 V240"/>
<circle class="dot" cx="70" cy="60" r="2.5"/><circle class="dot" style="animation-delay:.8s" cx="180" cy="120" r="3"/>
<circle class="dot" style="animation-delay:1.6s" cx="880" cy="70" r="2.5"/><circle class="dot" style="animation-delay:2.2s" cx="930" cy="200" r="2.2"/>
<circle class="dot" style="animation-delay:1.2s" cx="110" cy="230" r="2"/><circle class="dot" style="animation-delay:.4s" cx="820" cy="290" r="2.6"/>
<path class="br" d="M20 44 V20 H44"/><path class="br" d="M956 20 H980 V44"/>
<path class="br" d="M20 276 V300 H44"/><path class="br" style="animation-delay:1s" d="M956 300 H980 V276"/>
<text x="500" y="62" text-anchor="middle" class="k">SAP · SUPPLY CHAIN · INDUSTRIAL ENGINEERING</text>
<g filter="url(#glow)" class="shine"><text x="500" y="125" text-anchor="middle" class="n"><tspan fill="#eaf2ff">GHASSEN </tspan><tspan fill="url(#name)">NOM</tspan></text></g>
<rect class="bar" x="440" y="141" width="120" height="2" fill="#38a1ff"/>
<text x="500" y="172" text-anchor="middle" class="s">S/4HANA Manufacturing · Production Planning · Continuous Improvement</text>
