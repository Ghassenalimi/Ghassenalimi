<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ghassen Alimi - Industrial Engineering and Data</title>
  <desc id="desc">Professional animated banner for an industrial engineering student seeking a PFE internship in Tunisia or internationally.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".48" stop-color="#0a1734"/>
      <stop offset="1" stop-color="#071126"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".48"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .eyebrow { fill: #7dd3fc; font-size: 12px; font-weight: 700; letter-spacing: 5px; }
      .name { fill: url(#headline); font-size: 52px; font-weight: 800; letter-spacing: 1px; }
      .role { fill: #b5c7e6; font-size: 16px; letter-spacing: .5px; }
      .micro { fill: #8ca6cd; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; }
      .badge-text { fill: #dbeafe; font-size: 11px; font-weight: 700; }
      .badge { fill: #0c1d3b; fill-opacity: .86; stroke: #60a5fa; stroke-opacity: .42; }
      .orb { animation: drift 11s ease-in-out infinite alternate; }
      .orb.violet { animation-duration: 15s; animation-direction: alternate-reverse; }
      .ring { transform-origin: 1010px 180px; animation: spin 18s linear infinite; }
      .ring.slow { animation-duration: 27s; animation-direction: reverse; }
      .signal { stroke-dasharray: 5 12; animation: flow 5s linear infinite; }
      .spark { animation: twinkle 2.8s ease-in-out infinite; }
      .spark.two { animation-delay: .8s; }
      .spark.three { animation-delay: 1.6s; }
      .reveal { animation: reveal .9s ease-out both; }
      .reveal.one { animation-delay: .15s; }
      .reveal.two { animation-delay: .3s; }
      .reveal.three { animation-delay: .45s; }
      .underline { transform-origin: 110px 0; animation: grow 3.5s ease-in-out infinite; }
      @keyframes drift { from { transform: translate(-18px, 5px); } to { transform: translate(24px, -12px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes flow { to { stroke-dashoffset: -85; } }
      @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.3); } }
      @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { 0%, 100% { transform: scaleX(.45); opacity: .55; } 50% { transform: scaleX(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .orb, .ring, .signal, .spark, .reveal, .underline { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <circle class="orb" cx="155" cy="60" r="250" fill="url(#blueGlow)"/>
  <circle class="orb violet" cx="1040" cy="305" r="260" fill="url(#violetGlow)"/>

  <path class="signal" d="M0 285H145l48-42h160" fill="none" stroke="#38bdf8" stroke-opacity=".38" stroke-width="1.4"/>
  <path class="signal" d="M1200 86h-132l-42 38H875" fill="none" stroke="#818cf8" stroke-opacity=".34" stroke-width="1.4"/>
  <path d="M52 58V30h28M1120 30h28v28M52 302v28h28M1120 330h28v-28" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>

  <g class="reveal">
    <text x="86" y="82" class="eyebrow">INDUSTRIAL ENGINEERING STUDENT AT ENSIT</text>
    <text x="86" y="145" class="name" filter="url(#shadow)">GHASSEN ALIMI</text>
    <rect class="underline" x="88" y="164" width="220" height="3" rx="2" fill="url(#accent)"/>
    <text x="88" y="202" class="role">Process Optimization  ·  Supply Chain  ·  Data Analytics</text>
    <text x="88" y="228" class="micro">TURNING INDUSTRIAL DATA INTO BETTER DECISIONS</text>
  </g>

  <g class="reveal one">
    <rect class="badge" x="88" y="260" width="116" height="30" rx="15"/>
    <circle cx="104" cy="275" r="3" fill="#38bdf8"/>
    <text x="115" y="279" class="badge-text">Lean Six Sigma</text>
    <rect class="badge" x="214" y="260" width="70" height="30" rx="15"/>
    <circle cx="230" cy="275" r="3" fill="#60a5fa"/>
    <text x="241" y="279" class="badge-text">SAP</text>
    <rect class="badge" x="294" y="260" width="104" height="30" rx="15"/>
    <circle cx="310" cy="275" r="3" fill="#818cf8"/>
    <text x="321" y="279" class="badge-text">Power BI</text>
    <rect class="badge" x="408" y="260" width="82" height="30" rx="15"/>
    <circle cx="424" cy="275" r="3" fill="#a78bfa"/>
    <text x="435" y="279" class="badge-text">Python</text>
  </g>

  <g transform="translate(1010 180)">
    <circle class="ring" r="112" fill="none" stroke="#60a5fa" stroke-opacity=".18" stroke-width="1" stroke-dasharray="2 14"/>
    <circle class="ring slow" r="82" fill="none" stroke="#a78bfa" stroke-opacity=".24" stroke-width="1.2" stroke-dasharray="36 16"/>
    <circle r="48" fill="#0b1d3c" stroke="url(#accent)" stroke-opacity=".7" stroke-width="2"/>
    <path d="M-25 8h18l10-22 12 38 12-23h18" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="spark" cx="-73" cy="-65" r="3" fill="#67e8f9"/>
    <circle class="spark two" cx="91" cy="-20" r="3" fill="#a78bfa"/>
    <circle class="spark three" cx="48" cy="78" r="3" fill="#60a5fa"/>
  </g>

  <g class="reveal two">
    <rect x="760" y="278" width="310" height="34" rx="17" fill="#0b1b38" fill-opacity=".8" stroke="#38bdf8" stroke-opacity=".42"/>
    <circle cx="782" cy="295" r="4" fill="#34d399"/>
    <text x="796" y="299" class="badge-text">PFE INTERNSHIP · TUNISIA / INTERNATIONAL</text>
  </g>
</svg>
